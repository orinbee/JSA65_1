<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Movie Web</title>
    <link rel="stylesheet" href="./asset/css/style.css">
</head>
<body>

<header>
    <div class="logo">
        MovieWeb
    </div>

    <nav>
        <a href="#">Trang chủ</a>
        <a href="#">Phim lẻ</a>
        <a href="#">Phim bộ</a>
    </nav>

    <div class="search-box">
        <input type="text" placeholder="Tìm phim...">
    </div>
</header>

<section class="banner">
    <img src="https://via.placeholder.com/1200x400">
</section>

<section>
    <h2>Phim nổi bật</h2>

    <div class="movie-grid">

        <div class="movie-card">
            <img src="https://via.placeholder.com/200x300">
            <h3>Avatar</h3>
            <p>8.5/10</p>
        </div>

        <div class="movie-card">
            <img src="https://via.placeholder.com/200x300">
            <h3>Batman</h3>
            <p>8.0/10</p>
        </div>

        <div class="movie-card">
            <img src="https://via.placeholder.com/200x300">
            <h3>Spider Man</h3>
            <p>8.3/10</p>
        </div>

    </div>
</section>

<script src="js/app.js"></script>

</body>
</html>
